  <g fill="#0a0a0b" transform="translate(0 -4)">
    <path id="wave" d="M14 50 C26 33 44 21 61 21 C77 21 86 29 86 39.5 A10 10 0 0 1 66 39.5 C66 36.5 62.5 35 58 35 C46 35 32 42 14 50 Z"/>
    <use href="#wave" transform="rotate(180 50 50) translate(0 -8)"/>
  </g>
</svg>
