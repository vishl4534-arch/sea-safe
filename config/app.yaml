      - {name: "INCOIS ocean state forecast", url: "https://incois.gov.in/portal/osf/osf.jsp"}
    # Emergency numbers at sea: only numbers the owner has approved, each with its source.
    # Approved 13 Nov 2026.
    emergency_contacts:
      - {name_key: contact.coast_guard_in, number: "1554",
         source: "Indian Coast Guard, toll-free search and rescue for fishermen at sea: https://indiancoastguard.gov.in/sites/default/files/202209050604245756604MARITIME.pdf"}
    replay: [karnataka_2025_05_20, karnataka_tauktae_2021_05_15]
    harbours:
      - {id: mangaluru, lat: 12.8598, lon: 74.8326, enabled: true, aliases: ["Mangalore", "Bunder", "Old Port", "Mangaluru Bunder", "ಮಂಗಳೂರ", "ಬಂದರ್"]}
      - {id: malpe,     lat: 13.3476, lon: 74.6994, enabled: true, aliases: ["Udupi", "Malpe Bunder", "ಉಡುಪಿ"]}
      - {id: gangolli,  lat: 13.6333, lon: 74.6750, enabled: true, aliases: ["Kundapura", "Kundapur", "Coondapoor", "Gangoli", "Gangolly", "ಕುಂದಾಪುರ", "ಕುಂದಾಪುರದ", "ಗಂಗೊಳ್ಳಿ"]}
      - {id: bhatkal,   lat: 13.9668, lon: 74.5353, enabled: true, aliases: ["Bhatkala", "ಭಟ್ಕಳ"]}
      - {id: honnavar,  lat: 14.2762, lon: 74.4406, enabled: true, aliases: ["Honavar", "Honnavara", "ಹೊನ್ನಾವರ"]}
      - {id: tadri,     lat: 14.5245, lon: 74.3551, enabled: true, aliases: ["Tadadi", "Tadri port", "Kumta", "ತದ್ರಿ", "ಕುಮಟಾ"]}
      - {id: belekeri,  lat: 14.7079, lon: 74.2574, enabled: true, aliases: ["Belikeri", "Belekere", "Ankola", "ಅಂಕೋಲಾ", "ಬೆಲೆಕೇರಿ"]}
