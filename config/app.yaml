# Sea Safe app configuration. Regions, harbours, languages, forecast window,
# trip length and replay days live here, not in code.
# Switch anything off with `enabled: false`; nothing else needs to change.
# Place names (all languages) live in translations/*.json under "place.<id>".
# aliases: other names people say for a harbour (town names, spellings); used only to understand questions.

forecast:
  window_hours: 48            # how far ahead the app will assess
  live_cache_minutes: 30      # reuse live data younger than this
  stale_after_hours: 6        # older cached data counts as missing -> CAUTION
  big_sea_cell_distance_km: 5 # above this, the sea-cell distance is shown prominently
  max_sea_cell_distance_km: 20  # map clicks further than this from wave data are refused

# The map. A free vector style from OpenFreeMap (no key); the page recolours it so the sea leads.
map_style: "https://tiles.openfreemap.org/styles/fiord"

# Wind picture: moving streaks on the map. DISPLAY ONLY, never used for a verdict (app/windfield.py).
# One Open-Meteo Forecast call per region for a grid of points. The areas and the step are our own
# choice: wide enough to fill the map around the harbours, coarse enough to stay one small request.
wind_picture:
  enabled: true
  step_degrees: 0.5
  areas:
    karnataka: {west: 71.5, south: 11.5, east: 76.5, north: 16.5}
    uae:       {west: 51.5, south: 22.5, east: 58.5, north: 27.5}

trip:
  default_hours: 6            # ASSUMPTION, not sourced (docs/design.md section 4)
  quick_choices: [4, 6, 8, 12]
  max_hours: 24

models:
  live:
    marine_api: "https://marine-api.open-meteo.com/v1/marine"
    marine_model: ecmwf_wam
    weather_api: "https://api.open-meteo.com/v1/forecast"
    weather_model: best_match
  replay:
    marine_api: "https://marine-api.open-meteo.com/v1/marine"
    marine_model: meteofrance_wave
    weather_api: "https://historical-forecast-api.open-meteo.com/v1/forecast"
    weather_model: best_match
  replay_coarse:
    marine_api: "https://marine-api.open-meteo.com/v1/marine"
    marine_model: era5_ocean
    weather_api: "https://archive-api.open-meteo.com/v1/archive"
    weather_model: best_match
  elevation_api: "https://api.open-meteo.com/v1/elevation"

# model_sentence: false (default for all, decided 12 Nov 2026) = around a check the model's own words are never
# shown; replies use reviewed templates only, and the second model call is skipped.
# Small talk with no check ("hi, I'm Vish") is always the model's own short reply, through the guard
# (owner request, 13 Nov 2026); the questions for missing trip details are reviewed templates.
# true = the model adds one intro sentence, checked by the word guard in app/chat.py
# (a word blocklist cannot catch every way of implying safety, which is why it is off).
languages:
  en: {enabled: true, name: "English", english_name: "English", dir: ltr, model_sentence: false}
  kn: {enabled: true, name: "ಕನ್ನಡ", english_name: "Kannada", dir: ltr, model_sentence: false}
  ar: {enabled: true, name: "العربية", english_name: "Arabic", dir: rtl, model_sentence: false}

# model_questions (owner, 13 Nov 2026): when a trip detail is missing, code decides what to ask and the model
# only words the question (guarded: no digits, no verdict or safety words; else the reviewed template).
model_questions: true

regions:
  karnataka:
    enabled: true
    timezone: Asia/Kolkata
    languages: [en, kn]
    map: {center: [13.8, 74.4], zoom: 8}
    official_warnings:
