      - {id: dubai_umm_suqeim,     lat: 25.1724, lon: 55.2135, enabled: true, aliases: ["Umm Suqeim", "Umm Suqueim", "ام سقيم"]}
      - {id: dubai_al_hamriya,     lat: 25.3018, lon: 55.3339, enabled: true, aliases: ["Hamriya", "Hamriyah", "Deira", "الحمرية"]}
