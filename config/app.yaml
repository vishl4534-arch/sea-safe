replays:
  karnataka_2025_05_20:
    date: "2025-05-20"
    models: replay
    coarse: false
  karnataka_tauktae_2021_05_15:
    date: "2021-05-15"
    models: replay_coarse
    coarse: true                # ~50 km grid: neighbouring harbours share numbers
  uae_2025_02_25:
    date: "2025-02-25"
    models: replay
    coarse: false

replay_clock:
  start_hour: 4               # replay "now" = 04:00 local on the replay date
  default_departure_hour: 5

# Voice (ElevenLabs). Speech-to-text turns the question into text; the chat and the code decide
# the answer; text-to-speech reads the reviewed spoken templates word for word.
# Needs ELEVENLABS_API_KEY in .env. Switch off with enabled: false: the map and typed chat keep working.
voice:
  enabled: true
  stt_model: scribe_v3            # ElevenLabs Scribe v3: writes times as digits ("5:00"); ~1.5 s
  tts_model: eleven_v4_turbo      # v4 Turbo: Kannada, Arabic, English; ~1.6 s per sentence (v4 ~3.3 s, v3 ~4 s)
  output_format: mp3_44100_64     # small files, fine for speech
  timeout_seconds: 20
  max_record_seconds: 20
  max_spoken_chars: 1500          # longer answers are not sent to text-to-speech (credit guard)
  # stt / tts: the language codes ElevenLabs expects (ISO 639-3 for speech-to-text, 639-1 for speech)
  languages:
    en: {stt: eng, tts: en, voice_id: l69wlWTZVIKv0UxMucTn, voice_name: "Riya Rao - Warm Professional"}
    kn: {stt: kan, tts: kn, voice_id: z5dCxveFRvWeqsaKgMqe, voice_name: "Krishna Priya M - Confident News Anchor"}
    ar: {stt: ara, tts: ar, voice_id: QsV9PCczMIklRM6xLPAS, voice_name: "Heba Mansuri - Arabic Customer Care"}

# Watch this trip, on the server (owner, 13 Nov 2026): the trip is checked again every check_minutes until departure;
# a Web Push notification is sent only when the verdict changes. Notifications go only to these push services.
# vapid_subject: the contact address the push services may use (set by the owner, 13 Nov 2026).
watch:
  enabled: true
  check_minutes: 15
  max_watches: 500
  ttl_seconds: 3600
  vapid_subject: "mailto:v1shst0ck55@gmail.com"
  push_hosts: [fcm.googleapis.com, push.services.mozilla.com, web.push.apple.com, notify.windows.com]
